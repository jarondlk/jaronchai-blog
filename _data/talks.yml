# TALKS

- title: "IMBC2025 Oral Presentation Awards - Automated Taxonomic Identification of Marine Plankton"
  event: "International Marine Biotechnology Congress 2025"
  date: "2025-07-08"
  location: "Brest, France"
  description: >
    Oral presentation of my work on "Automated Taxonomic Identification of Marine Plankton Using
    a Large-Language-Model and Retrieval-Augmented-Generation Framework." With my presentation,
    I recieived IMBC organization awards for other outstanding oral presentations.  
    IMBC2025 Website: https://www-iuem.univ-brest.fr/imbc-2025/?lang=e
  links:
    slides: "https://jaronchai.com/assets/documents/Jaronchai_IMBC2025_small.pdf"
    abstract: "https://jaronchai.com/assets/talks/2025-07-08/imbc_abs.pdf"
  images:
    - assets/talks/2025-07-08/imbc1.png
    - assets/talks/2025-07-08/imbc2.png

- title: "Semantic Plankton: Multimodal LLMs and RAG for Automated Ocean Microorganism Analysis"
  event: "Earth, Sea and Sky XI: Workshop for International Joint Graduate Program & Core Research Cluster in Earth and Environmental Sciences"
  date: "2025-06-03"
  location: "Tohoku University, Sendai, Japan"
  description: >
    Poster presentation on my Semantic Plankton project, in the event organized by Tohoku University and GP-EES,
    focusing on the use of multimodal large language models (LLMs) and retrieval-augmented generation (RAG) techniques
    for automated analysis of ocean microorganisms.
  links:
    abstract: "https://jaronchai.com/assets/talks/2025-06-03/ESS-Ⅺ-2025_abst_Jaronchai.pdf"
    poster: "https://jaronchai.com/assets/talks/2025-06-03/semantic.pdf"
  images:
    - assets/talks/2025-06-03/semantic.png

- title: "WPI-AIMEC workshop at Hawaii University"
  event: "Advance Institute for Marine Ecosystem and Climate (AIMEC) Workshop"
  date: "2025-03-04"
  location: "Hawaii University, Hawaii, USA"
  description: >
    Gave a talk on applications of Multimodal Large Language Models (LLMs) in marine ecosystem research,
    main example is from my Semantic Plankton project. Check out the slides for more details on the implementations.
  links:
    slides: "https://jaronchai.com/assets/talks/2025-03-04/plankton_llm_rag.pdf"
  images:
    - assets/talks/2025-03-04/hawaii1.jpg
    - assets/talks/2025-03-04/hawaii2.jpg


