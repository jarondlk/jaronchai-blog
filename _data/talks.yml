- title: "Data Integration and Platform Unification Challenges in Marine Bioinformatics"
  event: "COSMEC and ANEMONE Global Joint Symposium 2026"
  date: "2026-02-06"
  location: "Tokyo, Japan"
  description: >
    In this talk, I have discussed the challenges of data integration and platform unification in
    marine bioinformatics, with a focus on the ANEMONE project. I have highlighted the importance
    of integrating diverse datasets and unifying platforms to enhance our understanding of marine
    ecosystems and improve conservation efforts.
  links:
    website: "https://wpi-aimec.jp/en/event/3585/"
    slides: "https://jaronchai.com/assets/talks/2026-02-06/anemone.pdf"
    video: "/assets/talks/2026-02-06/anemone-global-data-backbone.mp4"
