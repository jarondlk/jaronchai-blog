name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    # Keep the runner compatible with the Ruby patch pinned in .ruby-version.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: .ruby-version

      - name: Build site and check generated HTML
        run: make test
